<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="button" value="Easy" onclick="setRandom(1)">
    <input type="button" value="Medium" onclick="setRandom(2)">
    <input type="button" value="Hard" onclick="setRandom(3)">

    <script>
        var secret = "";
        function setRandom(level){
            secret ="";
            
            while(level > 0){
                let n = (Math.floor(Math.random() * 10));
                console.log(n);
                secret = secret.concat(n);
                
                level --;
            }
            
        }
        function evaluate(){
            let g = Number(document.getElementById("guess").value);
            let s = Number(secret);
            const compare = document.getElementById("compare");
            if (g < s){
                compare.textContent = "Too low!"
            }
              if (g > s){
                compare.textContent = "Too high!"
            }
            if (g === s){
                compare.textContent = "Correct"
            }
        }
    </script>

    <input type="number" id="guess">Guess here
    <input type="button" value="Enter guess" onclick="evaluate()">
    <label id="compare"></label>
    
</body>
</html>
